mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://doh.pub/dns-query
    - https://1.0.0.1/dns-query
rules:
  - GEOIP,Private,DIRECT
  - MATCH,手动选择
proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - 美国主线路
      - 德国[备用节点]
    include-all: true
    filter: '^(?!美国主线路$|德国\[备用节点\]$).*$'
  - name: 手动选择
    type: select
    proxies:
      - 美国主线路
      - 德国[备用节点]
    include-all: true
    filter: '^(?!美国主线路$|德国\[备用节点\]$).*$'
  - name: Proxy
    type: select
    proxies:
      - Auto
    include-all: true
    hidden: true
  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    hidden: true
  - name: 宝可梦
    type: select
    include-all: true
    filter: '丨'
  - name: isp住宅
    type: select
    include-all: true
    filter: '^isp-|US-静态|前置-|🆓|👉|vless-ym|\|'
  - name: 其他
    type: select
    include-all: true
    filter: '^[A-Z]{2}-[A-Z]'
  - name: 前置-机场
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '^isp-前置-|^isp-🆓无敌前置-'
