mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://doh.pub/dns-query
    - https://1.0.0.1/dns-query
rules:
  - GEOIP,Private,DIRECT
  - MATCH,手动选择
# URnetwork 美国住宅代理（免费 30GiB/天，00:00 UTC 重置）：token 即子域名前缀，三个用户都能看到；
# 出口 IP 每次连接轮换（实测 AT&T 住宅，下次不一定），不走 m-ui 流量统计。m-ui 会把模板节点排在最前。
proxies:
  - name: UR-US-美国住宅
    type: http
    server: 06gv8oqfj2ia9i6673jsg4a812qnsscddvkgu7fsmc9l5oubre3djfrb6g.crisp.bringyour.com
    port: 7155
    tls: true
proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - 美国主线路
      - 德国[备用节点]
      - UR-US-美国住宅
    include-all: true
    filter: '^(?!美国主线路$|德国\[备用节点\]$|UR-US-美国住宅$).*$'
  - name: 手动选择
    type: select
    proxies:
      - 美国主线路
      - 德国[备用节点]
      - UR-US-美国住宅
    include-all: true
    filter: '^(?!美国主线路$|德国\[备用节点\]$|UR-US-美国住宅$).*$'
  - name: Proxy
    type: select
    proxies:
      - Auto
    include-all: true
    hidden: true
  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    hidden: true
  - name: 宝可梦
    type: select
    include-all: true
    filter: '丨'
  - name: isp住宅
    type: select
    include-all: true
    filter: '^isp-|US-静态|前置-|🆓|👉|vless-ym|\|'
  - name: 其他
    type: select
    include-all: true
    filter: '^[A-Z]{2}-[A-Z]'
  - name: 前置-机场
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '^isp-前置-|^isp-🆓无敌前置-'
