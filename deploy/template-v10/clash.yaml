mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://doh.pub/dns-query
    - https://1.0.0.1/dns-query
rules:
  - GEOIP,Private,DIRECT
  - MATCH,GLOBAL
# UR-US-美国住宅改走 URnetwork 外部订阅（GCP 本机 127.0.0.1:8899/ur.yaml），不再写在模板 proxies 里；
# GLOBAL 里的置顶与 filter 排除保持不变（节点名仍在生成列表里）。
# v9 新增 URnetwork 组（只含 UR-US-美国住宅），FlClash 里可单独选。
# v10 拿掉模板里的 Proxy/Auto/手动选择：Proxy/Auto 还给开关控制（开关关着就不生成）；
# 手动选择与 GLOBAL 完全重复，MATCH 改指 GLOBAL。
proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - 美国主线路
      - 德国[备用节点]
      - UR-US-美国住宅
    include-all: true
    filter: '^(?!美国主线路$|德国\[备用节点\]$|UR-US-美国住宅$).*$'
  - name: 宝可梦
    type: select
    include-all: true
    filter: '丨'
  - name: isp住宅
    type: select
    include-all: true
    filter: '^isp-|US-静态|前置-|🆓|👉|vless-ym|\|'
  - name: 其他
    type: select
    include-all: true
    filter: '^[A-Z]{2}-[A-Z]'
  - name: 前置-机场
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '^isp-前置-|^isp-🆓无敌前置-'
  - name: URnetwork
    type: select
    proxies:
      - UR-US-美国住宅
