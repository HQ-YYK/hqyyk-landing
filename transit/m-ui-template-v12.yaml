mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://doh.pub/dns-query
    - https://1.0.0.1/dns-query
rules:
  - GEOIP,Private,DIRECT
  - MATCH,GLOBAL
# UR-US-美国住宅改走 URnetwork 外部订阅（GCP 本机 127.0.0.1:8899/ur.yaml），不再写在模板 proxies 里；
# GLOBAL 里的置顶与 filter 排除保持不变（节点名仍在生成列表里）。
# v9 新增 URnetwork 组（只含 UR-US-美国住宅），FlClash 里可单独选。
# v10 拿掉模板里的 Proxy/Auto/手动选择：Proxy/Auto 还给开关控制（开关关着就不生成）；
# 手动选择与 GLOBAL 完全重复，MATCH 改指 GLOBAL。
# v11 每条目一个 tab（德国除外，只放 GLOBAL 置顶）：宝可梦机场/isp静态住宅改名与面板条目一致；
# [忘记是哪来了的]单独成组（CC-City 格式减 6 个已知单节点名）；5 个单节点各成一组；
# 单节点组一律用 include-all + 精确名 filter，不写 proxies——Fu/Xiao 没有这些节点，显式成员会让他们的订阅校验失败。
# URnetwork 也改 filter（同理）。sing-box 不变（无 filter 机制，显式成员会坏 Fu/Xiao 的配置）。
# v11 的问题：模板是静态的，没分配的订阅 tab 还在（空 tab）；组名撞节点名时节点被改名，精确 filter 匹配不上（US/NL/DE 三个 tab 是空的）。
# v12 改走面板代码生成（fork per-sub-groups 分支 e50a98a，BuildClashFor 按用户已分配的订阅自动生成组）：
# 模板里只留 GLOBAL + 前置-机场，9 个按条目分的 filter 组全删（代码生成同名组，留着会变成“宝可梦机场 2”这种重复 tab）。
# 前置-机场加 hidden: true（mihomo 支持该字段，FlClash 是否隐藏待实测；不隐藏也不影响使用）。
# sing-box 不变（代码只改了 Clash 生成；sing-box 仍用 v11 的选择组）。
proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - 美国主线路
      - 德国[备用节点]
      - UR-US-美国住宅
    include-all: true
    filter: '^(?!美国主线路$|德国\[备用节点\]$|UR-US-美国住宅$).*$'
  - name: 前置-机场
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
    include-all: true
    filter: '^isp-前置-|^isp-🆓无敌前置-'
